# Catalogo de versoes. Uma fonte da verdade para todos os modulos Kotlin.
[versions]
java = "25"
kotlin = "2.4.10"
compose = "1.12.0"
ktor = "3.5.2"
koin = "4.2.2"
logback = "1.6.3"
serialization = "1.11.0"
exposed = "1.5.0"          # SQL em Kotlin (DSL), sobre JDBC
hikari = "7.1.0"           # pool de conexoes
postgresql = "42.7.13"     # driver JDBC
flyway = "13.7.0"          # migracoes versionadas
testcontainers = "2.0.5"   # PostgreSQL descartavel nos testes de integracao
archunit = "1.5.0"         # teste de arquitetura (regra de dependencia)
agp = "9.1.0"              # Android Gradle Plugin (exige Android Studio Panda 2 ou mais novo)
navigation = "2.9.2"       # Navigation Compose multiplataforma: rotas tipadas e deep link
adaptive = "1.2.0"         # classes de tamanho de janela (layout adaptativo)
activityCompose = "1.9.3"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

[libraries]
ktor-server-core        = { module = "io.ktor:ktor-server-core",                version.ref = "ktor" }
ktor-server-cio         = { module = "io.ktor:ktor-server-cio",                 version.ref = "ktor" }
ktor-server-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-statuspages = { module = "io.ktor:ktor-server-status-pages",        version.ref = "ktor" }
ktor-server-calllogging = { module = "io.ktor:ktor-server-call-logging",        version.ref = "ktor" }
ktor-server-caching     = { module = "io.ktor:ktor-server-caching-headers",     version.ref = "ktor" }
ktor-server-conditional = { module = "io.ktor:ktor-server-conditional-headers", version.ref = "ktor" }
ktor-server-cors        = { module = "io.ktor:ktor-server-cors",                version.ref = "ktor" }
ktor-server-testhost    = { module = "io.ktor:ktor-server-test-host",           version.ref = "ktor" }
ktor-client-core        = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-cio         = { module = "io.ktor:ktor-client-cio",                 version.ref = "ktor" }
ktor-client-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-json               = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-openapi     = { module = "io.ktor:ktor-server-routing-openapi",     version.ref = "ktor" }
ktor-server-swagger     = { module = "io.ktor:ktor-server-swagger",             version.ref = "ktor" }
exposed-core            = { module = "org.jetbrains.exposed:exposed-core",      version.ref = "exposed" }
exposed-jdbc            = { module = "org.jetbrains.exposed:exposed-jdbc",      version.ref = "exposed" }
exposed-javatime        = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
hikari                  = { module = "com.zaxxer:HikariCP",                     version.ref = "hikari" }
postgresql              = { module = "org.postgresql:postgresql",               version.ref = "postgresql" }
flyway-core             = { module = "org.flywaydb:flyway-core",                version.ref = "flyway" }
flyway-postgresql       = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
archunit                = { module = "com.tngtech.archunit:archunit",           version.ref = "archunit" }
navigation-compose      = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
material3-adaptive      = { module = "org.jetbrains.compose.material3.adaptive:adaptive",    version.ref = "adaptive" }
compose-ui-test         = { module = "org.jetbrains.compose.ui:ui-test",        version.ref = "compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose",    version.ref = "activityCompose" }
koin-core               = { module = "io.insert-koin:koin-core",                version.ref = "koin" }
koin-ktor               = { module = "io.insert-koin:koin-ktor",                version.ref = "koin" }
koin-test               = { module = "io.insert-koin:koin-test",                version.ref = "koin" }
logback                 = { module = "ch.qos.logback:logback-classic",          version.ref = "logback" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                 version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor                 = { id = "io.ktor.plugin",                           version.ref = "ktor" }
compose-multiplatform = { id = "org.jetbrains.compose",                  version.ref = "compose" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
versions              = { id = "com.github.ben-manes.versions",          version = "0.53.0" }
android-application   = { id = "com.android.application",                version.ref = "agp" }
android-kmp-library   = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official

# Android (DIM0524)
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 recusa combinar `com.android.application` com o plugin Kotlin Multiplatform
# ("not compatible ... since AGP 9.0"). Estes dois flags mantem o plugin Kotlin externo,
# que e o que o :app usa. O :shared nao precisa deles: usa o plugin de biblioteca KMP
# do proprio AGP (com.android.kotlin.multiplatform.library).
android.builtInKotlin=false
android.newDsl=false

quarkus.application.name=musi-api-quarkus

# O Render injeta PORT. Localmente cai no 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Endereco do servico de busca em Go.
# Fator III do 12-Factor App: configuracao no ambiente, nao no codigo.
quarkus.rest-client.busca.url=${MUSI_BUSCA_URL:http://localhost:9090}
quarkus.rest-client.busca.scope=jakarta.inject.Singleton

# /q/health e /q/openapi vem das extensoes, sem codigo adicional.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true


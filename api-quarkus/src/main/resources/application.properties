quarkus.application.name=musi-api-quarkus

# O Render injeta PORT. Localmente cai no 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# Testes numa porta livre qualquer: a 8081 e a da api-quarkus no docker compose, e a
# porta de teste padrao do Quarkus tambem e 8081.
quarkus.http.test-port=0

# Endereco do servico de busca em Go.
# Fator III do 12-Factor App: configuracao no ambiente, nao no codigo.
quarkus.rest-client.busca.url=${MUSI_BUSCA_URL:http://localhost:9090}
quarkus.rest-client.busca.scope=jakarta.inject.Singleton

# /q/health e /q/openapi vem das extensoes, sem codigo adicional.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=MUSI — API (Quarkus)
quarkus.smallrye-openapi.info-version=0.2.0
quarkus.smallrye-openapi.info-description=CRUD de obras e anotacoes sobre PostgreSQL, e a \
  busca por arvore de filtro, delegada ao servico Go. A ordenacao e sempre declarada por \
  quem consulta, nunca automatica (ADR-0002).

# CORS: sem isto o navegador barra chamadas de outra origem (Hoppscotch web,
# Swagger em outra porta, o app Web) antes de chegarem na API. Liberal de
# proposito - API de leitura, publica e sem credenciais, voltada ao ensino.
# `/.*/` e uma regex que casa qualquer origem. Numa API com autenticacao,
# troque por a lista de origens conhecidas.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.http.cors.exposed-headers=Location

# Banco (ADR-0004). Em dev e test, sem URL, o Dev Services sobe um PostgreSQL 17 no
# Docker. Em producao, a URL vem de DB_URL - a mesma variavel da api-ktor.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL:}
%prod.quarkus.datasource.username=${DB_USER:musi}
%prod.quarkus.datasource.password=${DB_PASSWORD:musi}
# Sem banco (o Render, ate a Sprint 3 - ADR-0004): MUSI_COM_BANCO=false. Sem URL, o Quarkus
# desativa o datasource sozinho, mas o Hibernate e o Flyway precisam ser desligados junto;
# o CRUD responde 503 e a busca continua.
%prod.quarkus.hibernate-orm.active=${MUSI_COM_BANCO:true}
%prod.quarkus.flyway.active=${MUSI_COM_BANCO:true}
# Pool pequeno: 512 MB de instancia e, na Sprint 3, o limite de conexoes do Neon.
quarkus.datasource.jdbc.max-size=5

# O esquema vem SO das migracoes do Flyway (as mesmas da api-ktor); o Hibernate nao
# cria nem altera tabelas.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
